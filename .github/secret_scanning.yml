# Secret-scanning + push-protection path allowlist.
#
# GraphSmith's R4 secret/PII redaction battery (checks/v040-trace.js and its
# adversarial suites under tests/) necessarily contains secret-SHAPED strings —
# fake API keys, tokens, and PII — so the redaction check can prove it CATCHES
# them. These are test fixtures, never real credentials. Excluding these paths
# keeps push protection from blocking the corpus that exercises the control.
paths-ignore:
  - "tests/**"
  - "checks/v040-trace.js"
